<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SimpleAwesome - Agencia de Autos</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <!-- Login -->
            <div id="seccion-login">
                <h1>SimpleAwesome - Iniciar Sesión</h1>
                <div class="form-group">
                    <input type="email" id="login-email" placeholder="Correo electrónico">
                    <input type="password" id="login-password" placeholder="Contraseña">
                    <button id="btn-login">Ingresar</button>
                    <button id="btn-registrar" style="background-color: #10b981;">Registrarse</button>
                </div>
                <p style="text-align: center; font-size:14px; color: #666;">
                    Haz clic en Registrarse si es tu primera vez, o ingresa con tus datos.
                </p>
            </div>

            <!-- Panel de gestión de autos (Después de hacer login)-->
             <div id="seccion-app" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1>Gestión de Autos SimplyAwesome</h1>
                    <button id="btn-logout" style="background-color: #dc2626; padding: 5px 10px; font-size: 12px;">Cerrar Sesión</button>
                </div>
                
                <!-- Formulario para agregar vehículo -->
                 <div id="formulario-admin" class="form-group">
                    <input type="text" id="marca" placeholder="Marca (Ej. Toyota)">
                    <input type="text" id="modelo" placeholder="Modelo (Ej. Yaris)">
                    <input type="number" id="anio" placeholder="Año">
                    <input type="number" id="precio" placeholder="Precio ($)">
                    <input type="text" id="estado" placeholder="Estado (Disponible, Vendido, En Reparación)">
                    <button id="btn-guardar">Registrar Vehículo</button>
                 </div>

                 <h2>Inventario Actual</h2>
                 <ul id="lista-vehiculos"></ul>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
