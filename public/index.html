<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SimpleAwesome - Agencia de Autos</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>SimplyAwesome - Gestión de Autos</h1>

            <!-- Formulario para agregar vehículo -->
             <div class="form-group">
                <input type="text" id="marca" placeholder="Marca (Ej. Toyota)">
                <input type="text" id="modelo" placeholder="Modelo (Ej. Yaris)">
                <input type="number" id="anio" placeholder="Año">
                <input type="number" id="precio" placeholder="Precio ($)">
                <input type="text" id="estado" placeholder="Estado (Disponible, Vendido, En Reparación)">
                <button id="btn-guardar">Registrar Vehículo</button>
             </div>

             <h2>Inventario Actual</h2>
             <ul id="lista-vehiculos"></ul>
        </div>

        <script src="app.js"></script>
    </body>
</html>
